org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
// 沙箱平台目录为 android-37.0，AGP 8.13 默认只认到 36，需显式放行。
android.suppressUnsupportedCompileSdk=37,37.0
android.enableJetifier=false
// Compose 编译器与 Kotlin 2.3 配合时不再需要 kotlinCompilerExtensionVersion；
// 保留下面这行是为了让构建日志明确记录所用 Compose 版本，便于排查。
compose.kotlinCompiler.verbose=false
